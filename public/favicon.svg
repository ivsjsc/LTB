<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Logo Long Thanh Beer (LTB)">
  <defs>
    <!-- Premium Golden Amber Gradient -->
    <linearGradient id="ltbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB052" />
      <stop offset="45%" stop-color="#C28E29" />
      <stop offset="85%" stop-color="#9E6E16" />
      <stop offset="100%" stop-color="#7B540E" />
    </linearGradient>
    <linearGradient id="ltbLightAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8861B" />
      <stop offset="60%" stop-color="#E5C16C" />
      <stop offset="100%" stop-color="#FAF0CD" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#171916" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Transparent / Clean Canvas Background -->
  <rect width="1000" height="1000" fill="transparent" />

  <g transform="translate(10, 10)">
    <!-- WHEAT / BARLEY MOTIF (Bông lúa mạch đặc trưng ngành ủ bia ở góc trên bên phải) -->
    <g id="wheat-stalk" filter="url(#subtleShadow)">
      <!-- Swash base arc connecting to B -->
      <path d="M 640,365 Q 730,365 890,395 C 840,380 770,360 740,335 C 715,310 710,335 640,365 Z" fill="url(#ltbGoldGrad)" />

      <!-- Central Stems -->
      <path d="M 735,360 Q 770,250 860,110" stroke="url(#ltbGoldGrad)" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 700,362 Q 720,270 760,165" stroke="url(#ltbGoldGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

      <!-- Left Stalk Grains -->
      <!-- Grains Pair 1 (Bottom) -->
      <ellipse cx="682" cy="330" rx="13" ry="24" transform="rotate(-30 682 330)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="708" cy="318" rx="13" ry="24" transform="rotate(35 708 318)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 2 -->
      <ellipse cx="698" cy="285" rx="13" ry="25" transform="rotate(-32 698 285)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="725" cy="272" rx="13" ry="25" transform="rotate(35 725 272)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 3 -->
      <ellipse cx="712" cy="240" rx="12" ry="24" transform="rotate(-34 712 240)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="740" cy="225" rx="12" ry="24" transform="rotate(37 740 225)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 4 -->
      <ellipse cx="728" cy="195" rx="11" ry="22" transform="rotate(-35 728 195)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="754" cy="180" rx="11" ry="22" transform="rotate(38 754 180)" fill="url(#ltbGoldGrad)" />

      <!-- Top Grain Left Stalk -->
      <ellipse cx="745" cy="155" rx="9" ry="20" transform="rotate(5 745 155)" fill="url(#ltbGoldGrad)" />

      <!-- Right Main Stalk Grains (Taller & fuller) -->
      <!-- Grains Pair 1 -->
      <ellipse cx="755" cy="310" rx="15" ry="27" transform="rotate(-28 755 310)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="788" cy="295" rx="15" ry="27" transform="rotate(38 788 295)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 2 -->
      <ellipse cx="775" cy="260" rx="15" ry="28" transform="rotate(-30 775 260)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="810" cy="242" rx="15" ry="28" transform="rotate(40 810 242)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 3 -->
      <ellipse cx="796" cy="210" rx="14" ry="27" transform="rotate(-32 796 210)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="832" cy="190" rx="14" ry="27" transform="rotate(42 832 190)" fill="url(#ltbGoldGrad)" />

      <!-- Grains Pair 4 -->
      <ellipse cx="820" cy="160" rx="13" ry="24" transform="rotate(-35 820 160)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="854" cy="140" rx="13" ry="24" transform="rotate(45 854 140)" fill="url(#ltbGoldGrad)" />

      <!-- Tip Grains -->
      <ellipse cx="848" cy="115" rx="11" ry="22" transform="rotate(-15 848 115)" fill="url(#ltbGoldGrad)" />
      <ellipse cx="872" cy="98" rx="8" ry="18" transform="rotate(25 872 98)" fill="url(#ltbGoldGrad)" />

      <!-- Awns (Beard of wheat/whisker filaments) -->
      <path d="M 872,90 L 900,45" stroke="url(#ltbGoldGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M 860,110 L 910,75" stroke="url(#ltbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 845,135 L 895,110" stroke="url(#ltbGoldGrad)" stroke-width="2" stroke-linecap="round" />
      <path d="M 745,150 L 760,105" stroke="url(#ltbGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- MONOGRAM EMBLEM: L - T - B INTERLOCKED -->
    <!-- Letter 'B' Backbone and Curves (Right side) -->
    <g id="letter-B" filter="url(#subtleShadow)">
      <!-- Main body of B -->
      <path d="M 460,378
               L 655,378
               C 725,378 775,410 775,475
               C 775,535 730,570 660,580
               C 745,592 795,640 795,715
               C 795,800 715,830 520,830
               L 475,830
               C 525,790 565,720 595,620
               L 645,620
               C 690,620 720,600 720,555
               C 720,510 685,490 635,490
               L 445,490
               Z"
            fill="url(#ltbGoldGrad)" />

      <!-- Lower Bow of B cutout/filling -->
      <path d="M 580,660
               L 650,660
               C 705,660 740,685 740,735
               C 740,780 705,800 640,800
               L 525,800
               C 545,750 565,705 580,660 Z"
            fill="url(#ltbGoldGrad)" opacity="0.95" />
    </g>

    <!-- Letter 'T' (Strong horizontal bar, serifed left & vertical stem extending down) -->
    <g id="letter-T" filter="url(#subtleShadow)">
      <!-- T Crossbar with serif -->
      <path d="M 175,378
               L 185,475
               L 205,475
               C 215,425 230,410 270,410
               L 580,410
               L 560,465
               L 420,465
               L 310,795
               C 300,825 290,845 270,852
               L 230,852
               L 230,880
               L 440,880
               L 440,852
               L 395,852
               C 375,845 370,825 380,795
               L 435,630
               L 455,630
               L 395,810
               L 520,465
               L 485,378
               Z"
            fill="url(#ltbGoldGrad)" />

      <!-- Left bracket serif of T -->
      <path d="M 175,378
               L 420,378
               L 405,435
               L 330,435
               C 275,435 240,445 220,500
               C 210,530 200,575 195,600
               L 165,600
               C 175,540 205,435 210,415
               L 175,415
               Z"
            fill="url(#ltbGoldGrad)" />
    </g>

    <!-- Letter 'L' (Distinct interweaving contour running through T and B) -->
    <g id="letter-L" filter="url(#subtleShadow)">
      <!-- Distinct white/negative gap cutout to make L float prominently inside T and B -->
      <path d="M 315,480
               L 260,740
               C 255,765 270,780 300,780
               L 460,780
               C 490,780 505,745 520,700
               L 535,705
               C 515,765 485,812 430,812
               L 270,812
               C 220,812 195,780 205,730
               L 265,480
               Z"
               fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />

      <!-- The Gold Body of L -->
      <path d="M 315,480
               L 260,740
               C 255,765 270,780 300,780
               L 460,780
               C 490,780 505,745 520,700
               L 535,705
               C 515,765 485,812 430,812
               L 270,812
               C 220,812 195,780 205,730
               L 265,480
               Z"
               fill="url(#ltbLightAccent)" stroke="url(#ltbGoldGrad)" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- Refined Accent Shadows & Precision Highlights on Monogram Junctions -->
    <path d="M 450,490 Q 480,550 515,620 Q 470,620 440,560 Z" fill="#6B4605" opacity="0.3" />
  </g>
</svg>
